<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-labelledby="title desc"><title id="title">One thread goes missing. Which pattern stays connected?</title><desc id="desc">Three undirected graphs each have five numbered vertices. A is a chain: 1-2, 2-3, 3-4, 4-5. B is a cycle: 1-2, 2-3, 3-4, 4-5, 5-1. C has a cycle and a branch: 1-2, 2-3, 3-4, 4-1, 4-5. Choose the graph that remains connected after removing any one edge.</desc><defs><linearGradient id="g"><stop stop-color="#95e9ef"/><stop offset=".5" stop-color="#bfb6fb"/><stop offset="1" stop-color="#efbfdd"/></linearGradient></defs><rect width="1080" height="350" rx="28" fill="#0b1529"/><text x="40" y="38" font-family="monospace" font-size="13" letter-spacing="3" fill="#accdde">A SMALL GRAPH PUZZLE</text><text x="40" y="83" font-family="Georgia,serif" font-size="30" fill="url(#g)">One thread goes missing. Which pattern stays connected?</text><rect x="43" y="110" width="294" height="202" rx="24" fill="#99e4ec" fill-opacity=".045" stroke="#99e4ec" stroke-opacity=".2"/><path d="M190 139L255 186" stroke="#99e4ec" stroke-width="2" opacity=".7"/><path d="M255 186L232 265" stroke="#99e4ec" stroke-width="2" opacity=".7"/><path d="M232 265L148 265" stroke="#99e4ec" stroke-width="2" opacity=".7"/><path d="M148 265L125 186" stroke="#99e4ec" stroke-width="2" opacity=".7"/><circle cx="190" cy="139" r="14" fill="#142038" stroke="#99e4ec"/><text x="190" y="144" text-anchor="middle" font-family="monospace" font-size="13" fill="#99e4ec">1</text><circle cx="255" cy="186" r="14" fill="#142038" stroke="#99e4ec"/><text x="255" y="191" text-anchor="middle" font-family="monospace" font-size="13" fill="#99e4ec">2</text><circle cx="232" cy="265" r="14" fill="#142038" stroke="#99e4ec"/><text x="232" y="270" text-anchor="middle" font-family="monospace" font-size="13" fill="#99e4ec">3</text><circle cx="148" cy="265" r="14" fill="#142038" stroke="#99e4ec"/><text x="148" y="270" text-anchor