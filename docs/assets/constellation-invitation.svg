<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="title desc"><title id="title">One last little detour</title><desc id="desc">Collect five lights in an interactive constellation on our GitHub Pages introduction.</desc><defs><linearGradient id="g"><stop stop-color="#9de9ed"/><stop offset=".5" stop-color="#b7b5fa"/><stop offset="1" stop-color="#efbcda"/></linearGradient></defs><style>.light{animation:glimmer 4s ease-in-out 1}@keyframes glimmer{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.light{animation:none}}</style><rect width="1000" height="210" rx="30" fill="#0d172c"/><g fill="none" stroke="url(#g)" opacity=".3"><path d="M697 64 L833 36 L916 100 L838 166 L706 153 Z"/><path d="M697 64L838 166M833 36L706 153M916 100L706 153"/></g><g class="light" fill="url(#g)"><circle cx="697" cy="64" r="8"/><circle cx="833" cy="36" r="6"/><circle cx="916" cy="100" r="9"/><circle cx="838" cy="166" r="7"/><circle cx="706" cy="153" r="6"/></g><text x="46" y="42" font-family="monospace" font-size="12" letter-spacing="3" fill="#a8dbe5">ONE LAST LITTLE DETOUR</text><text x="44" y="96" font-family="Georgia,serif" font-size="36" fill="url(#g)">A thought. Another. A constellation.</text><text x="46" y="138" font-family="sans-serif" font-size="19" fill="#c0d0e3">Five lights to collect. No correct way to wonder.</text><text x="46" y="182" font-family="sans-serif" font-size="16" fill="#b5e4ee">Take a moment to play ↗</text></svg>