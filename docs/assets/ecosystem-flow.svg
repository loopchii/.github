<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">One curiosity, several ways to explore</title><desc id="desc">Research, design and play connect the company to Space, Live, Cloud, Online and Games. These ribbons show public destinations, not technical dependencies or measured quantities.</desc><defs><linearGradient id="ink"><stop stop-color="#91e7eb"/><stop offset=".48" stop-color="#b9b8fc"/><stop offset="1" stop-color="#f1c7df"/></linearGradient><radialGradient id="halo"><stop stop-color="#244356" stop-opacity=".8"/><stop offset="1" stop-color="#080f20" stop-opacity="0"/></radialGradient></defs><style>.flow{fill:none;stroke-linecap:round}.light{stroke-dasharray:2 120;animation:drift 4.8s linear 1;opacity:.8}@keyframes drift{to{stroke-dashoffset:-732}}@media(prefers-reduced-motion:reduce){.light{animation:none}}</style><rect width="1000" height="440" rx="28" fill="#080f20"/><ellipse cx="460" cy="230" rx="480" ry="240" fill="url(#halo)"/><text x="44" y="46" font-family="monospace" font-size="14" fill="#a9b9d1" letter-spacing="3">A SHARED CURIOSITY</text><text x="44" y="90" font-family="Georgia,serif" font-size="30" fill="#edf3fa">Different expressions. A connected purpose.</text><path class="flow" d="M 288 257 C 435 257 485 153 672 153" stroke="#91e7eb" stroke-width="22" opacity=".09"/><path class="flow light" d="M 288 257 C 435 257 485 153 672 153" stroke="#91e7eb" stroke-width="2" style="animation-delay:-0s"/><circle cx="684" cy="153" r="4" fill="#91e7eb"/><text x="708" y="150" font-family="sans-serif" font-size="19" letter-spacing="2" fill="#91e7eb">SPACE</text><text x="708" y="172" font-family="sans-serif" font-size="15" fill="#b8c5d7">Explore research</text><path class="flow" d="M 288 257 C 435 257 485 211 672 211" stroke="#aebcfa" stroke-width="22" opacity=".09"/><path class="flow light" d="M 288 257 C 435 257 485 211 672 211" stroke="#aebcfa" stroke-width="2" style="animation-delay:-2s"/><circle cx="684" cy="211" r="4" fill="#aebcfa"/><text x="708" y="208" font-family="sans-serif" font-size="19" letter-spacing="2" fill="#aebcfa">LIVE</text><text x="708" y="230" font-family="sans-serif" font-size="15" fill="#b8c5d7">Consider the evidence</text><path class="flow" d="M 288 257 C 435 257 485 269 672 269" stroke="#c9b8f3" stroke-width="22" opacity=".09"/><path class="flow light" d="M 288 257 C 435 257 485 269 672 269" stroke="#c9b8f3" stroke-width="2" style="animation-delay:-4s"/><circle cx="684" cy="269" r="4" fill="#c9b8f3"/><text x="708" y="266" font-family="sans-serif" font-size="19" letter-spacing="2" fill="#c9b8f3">CLOUD</text><text x="708" y="288" font-family="sans-serif" font-size="15" fill="#b8c5d7">Follow what is forming</text><path class="flow" d="M 288 257 C 435 257 485 327 672 327" stroke="#e1b9ed" stroke-width="22" opacity=".09"/><path class="flow light" d="M 288 257 C 435 257 485 327 672 327" stroke="#e1b9ed" stroke-width="2" style="animation-delay:-6s"/><circle cx="684" cy="327" r="4" fill="#e1b9ed"/><text x="708" y="324" font-family="sans-serif" font-size="19" letter-spacing="2" fill="#e1b9ed">ONLINE</text><text x="708" y="346" font-family="sans-serif" font-size="15" fill="#b8c5d7">Find a new perspective</text><path class="flow" d="M 288 257 C 435 257 485 385 672 385" stroke="#f1c7df" stroke-width="22" opacity=".09"/><path class="flow light" d="M 288 257 C 435 257 485 385 672 385" stroke="#f1c7df" stroke-width="2" style="animation-delay:-8s"/><circle cx="684" cy="385" r="4" fill="#f1c7df"/><text x="708" y="382" font-family="sans-serif" font-size="19" letter-spacing="2" fill="#f1c7df">GAMES</text><text x="708" y="404" font-family="sans-serif" font-size="15" fill="#b8c5d7">Make room for play</text><rect x="43" y="194" width="245" height="123" rx="25" fill="#101d30" stroke="#66809d" stroke-opacity=".4"/><text x="67" y="233" font-family="Georgia,serif" font-weight="bold" font-size="30" fill="url(#ink)">LOOPCHii</text